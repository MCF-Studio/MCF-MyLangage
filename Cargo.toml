[workspace]
resolver = "2"
members = ["compiler/diagnostics", "compiler/syntax", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mcf-diagnostics = { path = "compiler/diagnostics" }
mcf-syntax = { path = "compiler/syntax" }

[workspace.lints.rust]
unsafe_code = "forbid"
