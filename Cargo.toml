[workspace]
resolver = "2"
members = ["compiler/diagnostics", "compiler/syntax", "compiler/config", "compiler/semantic", "compiler/runtime", "compiler/view", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
license = "GPL-3.0-only"
authors = ["MCF Studio"]
repository = "https://github.com/MCF-Studio/MCF-MyLangage"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mcf-diagnostics = { path = "compiler/diagnostics" }
mcf-syntax = { path = "compiler/syntax" }
mcf-config = { path = "compiler/config" }
mcf-semantic = { path = "compiler/semantic" }
mcf-runtime = { path = "compiler/runtime" }
mcf-view = { path = "compiler/view" }

[workspace.lints.rust]
unsafe_code = "forbid"
